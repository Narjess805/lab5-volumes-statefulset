# Fichier modèle : de fausses valeurs uniquement.
# Le vrai secret est créé en ligne de commande :
#   kubectl create secret generic db-credentials \
#     --from-literal=POSTGRES_USER=appuser \
#     --from-literal=POSTGRES_PASSWORD='ChangeMe-123'
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_USER: exemple-utilisateur
  POSTGRES_PASSWORD: exemple-mot-de-passe
